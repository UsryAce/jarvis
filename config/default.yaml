# JARVIS Configuration
# Copy this to config.yaml and modify as needed

nvidia:
  api_base: "https://integrate.api.nvidia.com/v1"
  models:
    chat:
      - id: "meta/llama-3.1-70b-instruct"
        name: "Llama 3.1 70B"
        context_window: 128000
        max_output: 4096
      - id: "meta/llama-3.1-8b-instruct"
        name: "Llama 3.1 8B"
        context_window: 128000
        max_output: 4096
      - id: "upstage/solar-10.7b-instruct"
        name: "Solar 10.7B"
        context_window: 4096
        max_output: 4096
      - id: "meta/llama-3.1-405b-instruct"
        name: "Llama 3.1 405B"
        context_window: 128000
        max_output: 4096
      - id: "z-ai/glm-5.2"
        name: "GLM-5.2"
        context_window: 128000
        max_output: 4096
      - id: "moonshotai/kimi-k2.6"
        name: "Kimi K2.6"
        context_window: 128000
        max_output: 4096
      - id: "mistralai/mistral-large"
        name: "Mistral Large"
        context_window: 128000
        max_output: 4096
      - id: "deepseek-ai/deepseek-coder-6.7b-instruct"
        name: "DeepSeek Coder 6.7B"
        context_window: 128000
        max_output: 4096
      - id: "microsoft/phi-4-mini-instruct"
        name: "Phi-4 Mini"
        context_window: 128000
        max_output: 4096
      - id: "writer/palmyra-fin-70b-32k"
        name: "Palmyra Fin 70B"
        context_window: 32768
        max_output: 4096
    embedding:
      - id: "nvidia/nv-embedqa-e5-v5"
        name: "NV-Embed-QA-E5-v5"
        dimensions: 1024
      - id: "nvidia/nv-embedqa-mistral-7b-v2"
        name: "NV-Embed-QA-Mistral-7B-v2"
        dimensions: 4096
      - id: "baai/bge-m3"
        name: "BGE-M3"
        dimensions: 1024
    reranking:
      - id: "nvidia/nv-rerank-qa-mistral-4b-v3"
        name: "NV-Rerank-QA-Mistral-4B-v3"

# Provider secrets are resolved only from the protected control store.
credentials:
  provider: "control_store"
  legacy_env_migration_enabled: true

trust:
  database_path: "data/control.db"
  backup_directory: "data/backups"
  backup_retention_count: 5
  backup_retention_bytes: 536870912
  # Trusted-device sessions survive browser restarts, while server-side idle,
  # absolute-expiry, revocation, scope, and CSRF checks remain authoritative.
  session_idle_timeout_seconds: 43200  # 12 hours
  session_absolute_timeout_seconds: 604800  # 7 days
  allowed_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
    - "http://localhost:4173"
    - "http://127.0.0.1:4173"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

jarvis:
  name: "JARVIS"
  wake_word: "jarvis"
  language: "en"
  response_length: "medium"
  personality: "professional_witty"

agent:
  database: "./data/agent.db"
  workspace_root: "."
  max_retries: 2
  tool_timeout_seconds: 120

swarm:
  enabled: true
  max_agents: 8
  default_agents: 8
  max_agents_per_project: 3
  max_writers_per_project: 1
  task_timeout_seconds: 600
  default_runtime_seconds: 1800
  max_runtime_seconds: 7200
  workspace_database: "./data/workspaces.db"
  modes:
    - "cowork"
    - "council"
    - "swarm"

memory:
  type: "chromadb"
  path: "./data/memory"
  collection: "jarvis_memory"
  embedding_model: "nvidia/nv-embedqa-e5-v5"
  max_context: 8192
  similarity_threshold: 0.7

skills:
  enabled:
    - "system"
    - "files"
    - "web_search"
    - "code"
    - "memory"
    - "weather"
    - "calculator"
    - "trading"
    - "business"
    - "education"
    - "design"
    - "email"
    - "calendar"
    - "news"
    - "note"
    - "translation"
    - "reminder"
    - "search"
    - "time_date"
    - "knowledge"
    - "productivity"
  auto_load: true
  skill_dir: "src/skills"

voice:
  tts:
    engine: "nvidia"
    voice: "female"
    speed: 1.0
    pitch: 1.0
  stt:
    engine: "nvidia"
    language: "en"
    continuous: false
  audio:
    sample_rate: 16000
    channels: 1
    chunk_size: 1024

ui:
  host: "0.0.0.0"
  port: 8080
  theme: "dark"
  enable_voice: true
  enable_history: true
  max_history: 100

logging:
  level: "INFO"
  file: "./logs/jarvis.log"
  max_size: "10MB"
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

security:
  api_key_required: true
  allowed_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
    - "http://localhost:4173"
    - "http://127.0.0.1:4173"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  rate_limit: 100

external_apis:
  weather: ""
  news: ""
  search: ""
  search_cx: ""
  alpha_vantage: ""
  polygon: ""
  twelve_data: ""
  finnhub: ""
