version: '3.8'

services:
  jarvis:
    build: .
    container_name: jarvis
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Add a separate ChromaDB for persistence (if not using local)
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: jarvis-chromadb
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./data/chromadb:/chroma/chroma
  #   environment:
  #     - CHROMA_SERVER_HOST=0.0.0.0
  #     - CHROMA_SERVER_HTTP_PORT=8000

networks:
  default:
    name: jarvis-network